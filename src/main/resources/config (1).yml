# Item overrides. Any item can have its material, name, lore, and colours changed here. Example:
#
# items:
#   POTATO_SWORD:
#     material: NETHERITE_SWORD
#     name: "<gradient:#7FFF00:#32CD32><bold>Potato Sword</bold></gradient>"
#     colors: ["#7FFF00", "#32CD32"]
#     lore:
#       - "Kill a Marked player with it to forge the Warrior's Blade."
#
# Changing an item's material makes existing copies of that item invalid, so they are removed.


# Hierarchy Hammer. Chances are between 0 and 1 (0.20 = 20%). Durations are in ticks (20 = 1 second).
hammer:
  # Seconds between hammer leaps (right-click, or sneak + right-click).
  cooldown_seconds: 8
  lightning_chance: 0.20
  shockwave_radius: 4.0
  shockwave_damage: 6.0
  lifesteal_ticks: 40
  hierarchy_chance: 0.05
  hierarchy_height: 4.0
  kill_damage: 4.0
  max_arrows: 30
  aimlock_multiplier: 1.5
  aim_angle: 30
  aim_range: 14

# Passive effects. Each item gives one potion effect while held (either hand) or worn (armor).
# Format: EFFECT_NAME:level, where level 0 is level I. Remove a line to use the built-in default.
passives:
  duration_ticks: 60
  POTATO_OF_LIFE: "HEALTH_BOOST:0"
  GOLDEN_POTATO: "ABSORPTION:0"
  POTATO_SWORD: "STRENGTH:0"
  WARRIORS_BLADE: "STRENGTH:1"
  POTATO_HOE: "HASTE:0"
  POTATO_PICKAXE: "HASTE:0"
  POTATO_SHOVEL: "HASTE:0"
  POTATO_AXE: "SPEED:0"
  POTATO_SPEAR: "SPEED:0"
  POTATO_BOW: "SPEED:0"
  POTATO_MACE: "RESISTANCE:0"
  POTATO_SHIELD: "RESISTANCE:0"
  POTATO_CHARM: "LUCK:0"
  POTATO_WARD: "FIRE_RESISTANCE:0"
  POTATO_LANTERN: "NIGHT_VISION:0"
  POTATO_COMPASS: "DOLPHINS_GRACE:0"
  POTATO_FEATHER: "SLOW_FALLING:0"
  POTATO_SCROLL: "CONDUIT_POWER:0"
  POTATO_SLIME: "JUMP_BOOST:0"
  POTATO_GHAST: "REGENERATION:0"
  POTATO_BLAZE: "STRENGTH:0"
  POTATO_QUARTZ: "WATER_BREATHING:0"
  POTATO_ECHO: "HERO_OF_THE_VILLAGE:0"
  POTATO_A5_STRIKE: "JUMP_BOOST:0"
  ENCHANTED_POTATO_A5_STRIKE: "JUMP_BOOST:1"

# Durations, in ticks (20 = 1 second), for the potion effects that abilities and items give.
durations:
  a5:
    resistance_ticks: 60
  soup:
    regeneration_ticks: 100
  charm:
    luck_ticks: 400
    absorption_ticks: 300
  ward:
    resistance_ticks: 160
  quartz:
    glow_ticks: 160
  compass:
    glow_ticks: 200
  scroll:
    glow_ticks: 200
  mace:
    glacial_hold_ticks: 40
  frost_hammer:
    slow_ticks: 40

# Combat: after you hit or get hit by a player, a countdown shows above the hotbar.
combat:
  # Length of combat in seconds. Each new hit restarts the timer.
  seconds: 30
  # Show the countdown above the hotbar. Set to false to hide it.
  show_action_bar: true
  # Post "Combat started" and "Combat ended" in chat.
  messages: true

# /fillwand: the largest box (in blocks) that /fillwand fill can change at once.
fillwand:
  max_blocks: 50000
