name: PotatoSMP
version: '1.0.0'
main: PotatoSMP
api-version: '1.21'
description: Potato SMP - Potato of Life, Marked players, and the Warrior's Blade.
authors: [PotatoSMP]
commands:
  potato:
    description: Potato SMP command
    usage: /potato <help|menu|status|blade|give|reload|enable|disable|stop|recipes|nocooldown>
    aliases: [potatosmp]
permissions:
  potato.use:
    description: Use /potato help, recipes, and status.
    default: true
  potato.admin:
    description: Give items, reset the blade, reload config, enable or stop the plugin, open the menu, and set nocooldown.
    default: op
